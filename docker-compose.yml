services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cybersecurechain
      POSTGRES_USER: cybersecurechain
      POSTGRES_PASSWORD: cybersecurechain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cybersecurechain:cybersecurechain@db:5432/cybersecurechain
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
volumes:
  postgres_data:

